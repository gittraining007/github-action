name: CD Helm Pipeline

on:
  push:
    branches:
      - feature/Kubernetes

env:
  CHART_PATH: helm
  RELEASE_NAME: sample-webapp
  NAMESPACE: sample-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '1.27.0'

      - name: Set up Helm
        uses: azure/setup-helm@v1
        with:
          version: 'v3.11.0'

      - name: Configure kubeconfig
        # Expects the KUBECONFIG as a base64-encoded secret in KUBE_CONFIG_DATA
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
        env:
          KUBECONFIG: $HOME/.kube/config

      - name: Show kube context
        run: kubectl config current-context

      - name: Helm dependency update (if any)
        run: |
          if [ -f "${{ env.CHART_PATH }}/Chart.yaml" ]; then
            helm dependency update "${{ env.CHART_PATH }}" || true
          fi

      - name: Helm upgrade --install
        run: |
          # image.repository and image.tag are set via --set; adjust keys to match your chart's values.yaml
          IMAGE_REPO=${{ secrets.IMAGE_REPOSITORY }}
          IMAGE_TAG=${{ github.sha }}

          if [ -z "$IMAGE_REPO" ]; then
            echo "WARNING: secrets.IMAGE_REPOSITORY is empty. Set the repository via secrets or modify the workflow to use a different value source."
          fi

          helm upgrade --install ${{ env.RELEASE_NAME }} "${{ env.CHART_PATH }}" \
            --namespace ${{ env.NAMESPACE }} --create-namespace \
            --wait --timeout 5m \
            --set image.repository="$IMAGE_REPO" \
            --set image.tag="$IMAGE_TAG"

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/${{ env.RELEASE_NAME }} -n ${{ env.NAMESPACE }} --timeout=3m || true

      - name: Print release status
        run: helm status ${{ env.RELEASE_NAME }} -n ${{ env.NAMESPACE }}
