name: CD Helm Pipeline

on:
  push:
    branches:
      - feature/Kubernetes

env:
  CHART_PATH: helm
  RELEASE_NAME: sample-webapp
  NAMESPACE: sample-app
  ACR_NAME: acr007

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '1.27.0'

      - name: Set up Helm
        uses: azure/setup-helm@v1
        with:
          version: 'v3.11.0'

      - name: Get AKS credentials
        # Expects AZURE_RESOURCE_GROUP and AKS_CLUSTER_NAME in secrets
        run: |
          echo "Fetching AKS credentials for ${{ secrets.AKS_CLUSTER_NAME }} in resource group ${{ secrets.AZURE_RESOURCE_GROUP }}"
          az aks get-credentials --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name ${{ secrets.AKS_CLUSTER_NAME }} --overwrite-existing

      - name: (Optional) Attach ACR to AKS
        # Attach ACR to AKS so the cluster can pull from the registry (requires proper permissions)
        run: |
          if [ -n "${{ env.ACR_NAME }}" ] && [ -n "${{ secrets.AZURE_RESOURCE_GROUP }}" ] && [ -n "${{ secrets.AKS_CLUSTER_NAME }}" ]; then
            echo "Attaching ACR '${{ env.ACR_NAME }}' to AKS cluster '${{ secrets.AKS_CLUSTER_NAME }}' (may be a no-op if already attached)"
            az aks update -g ${{ secrets.AZURE_RESOURCE_GROUP }} -n ${{ secrets.AKS_CLUSTER_NAME }} --attach-acr ${{ env.ACR_NAME }} || true
          else
            echo "Skipping ACR attach because required values are missing. Ensure ACR_NAME env and AKS secrets are set."
          fi

      - name: Show kube context
        run: kubectl config current-context

      - name: Helm dependency update (if any)
        run: |
          if [ -f "${{ env.CHART_PATH }}/Chart.yaml" ]; then
            helm dependency update "${{ env.CHART_PATH }}" || true
          fi

      - name: Helm upgrade --install
        env:
          IMAGE_REPO: ${{ secrets.IMAGE_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ -z "$IMAGE_REPO" ]; then
            echo "WARNING: secrets.IMAGE_REPOSITORY is empty. Set the repository via secrets or modify the workflow to use a different value source."
          fi

          helm upgrade --install ${{ env.RELEASE_NAME }} "${{ env.CHART_PATH }}" \
            --namespace ${{ env.NAMESPACE }} --create-namespace \
            --wait --timeout 5m \
            --set image.repository="$IMAGE_REPO" \
            --set image.tag="$IMAGE_TAG"

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/${{ env.RELEASE_NAME }} -n ${{ env.NAMESPACE }} --timeout=3m || true

      - name: Print release status
        run: helm status ${{ env.RELEASE_NAME }} -n ${{ env.NAMESPACE }}
