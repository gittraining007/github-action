name: CD Docker Pipeline

on:
  workflow_run:
    workflows:
      - "CI Docker Pipeline"
    types:
      - completed
    branches:
      - feature/docker

env:
  ACR_NAME: acr007
  IMAGE_NAME: sample-webapp

jobs:

  deploy:

    if: github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    environment:
      name: Production

    permissions:
      id-token: write
      contents: read

    steps:

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy Container
      uses: azure/webapps-deploy@v3
      with:
        app-name: sample-webapp
        images: |
          ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
