name: Deploy Website

on:

  workflow_run:
    workflows: ["CI-Pipeline"]
    types:
      - completed

jobs:

  deploy:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      - uses: actions/download-artifact@v4
